# Local services. Start with `pnpm db:up`; data persists in the named volume.
name: pgtm

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: pgtm
      POSTGRES_PASSWORD: pgtm
      POSTGRES_DB: pgtm
    ports:
      # Local development only: bound to localhost.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgtm -d pgtm"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres:
