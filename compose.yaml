# Local services. `pnpm db:up` starts Postgres only; `pnpm api:up` also builds and starts
# the API (profile "app"). Data persists in the named volume.
name: pgtm

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: pgtm
      POSTGRES_PASSWORD: pgtm
      POSTGRES_DB: pgtm
    ports:
      # Local development only: bound to localhost.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgtm -d pgtm"]
      interval: 2s
      timeout: 5s
      retries: 30

  # One-shot: applies migrations, then exits. The API waits for it.
  migrate:
    profiles: [app]
    build: .
    image: pgtm-api
    command: ["node", "dist/migrate.mjs"]
    environment:
      DATABASE_URL: postgres://pgtm:pgtm@postgres:5432/pgtm
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: [app]
    build: .
    image: pgtm-api
    environment:
      DATABASE_URL: postgres://pgtm:pgtm@postgres:5432/pgtm
      CORS_ORIGINS: "*"
    ports:
      # Bound to localhost: a reverse proxy (nginx) in front publishes it.
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres:
