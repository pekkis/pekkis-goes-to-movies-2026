# Local services. `pnpm db:up` starts Postgres only; `pnpm api:up` also builds and starts
# the API (profile "app"). Data persists in the named volume.
name: pgtm

# If one of our containers is ever taken over, this limits what it can do: no writes outside
# a small /tmp, no Linux capabilities, no setuid escalation, bounded memory, processes and CPU
# (one core's worth: Node runs our code on one thread anyway).
# Our images run as `node` and write nothing (checked with `docker diff`, 2026-10-21).
x-hardened: &hardened
  read_only: true
  tmpfs:
    - /tmp:size=16m,noexec,nosuid,nodev
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  mem_limit: 512m
  pids_limit: 128
  cpus: 1.0

services:
  postgres:
    image: postgres:18-alpine
    # Its entrypoint starts as root, fixes ownership and drops to `postgres`: it keeps just
    # the capabilities for that. Data lives in the volume; the socket and /tmp in memory.
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
      - /var/run/postgresql:size=1m,noexec,nosuid,nodev
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 256
    # Parallel query workers may use more than one core. Docker refuses a value above the
    # host's core count: fine on the server (8 cores) and any laptop.
    cpus: 2.0
    environment:
      POSTGRES_USER: pgtm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pgtm}
      POSTGRES_DB: pgtm
    ports:
      # Local development only: bound to localhost.
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    volumes:
      - postgres:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgtm -d pgtm"]
      interval: 2s
      timeout: 5s
      retries: 30

  # One-shot: applies migrations, then exits. The API waits for it.
  migrate:
    <<: *hardened
    profiles: [app]
    build: .
    image: pgtm-api
    command: ["node", "dist/migrate.mjs"]
    environment:
      DATABASE_URL: postgres://pgtm:${POSTGRES_PASSWORD:-pgtm}@postgres:5432/pgtm
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *hardened
    profiles: [app]
    build: .
    image: pgtm-api
    environment:
      DATABASE_URL: postgres://pgtm:${POSTGRES_PASSWORD:-pgtm}@postgres:5432/pgtm
      CORS_ORIGINS: "*"
      # Set in .env to turn on the MCP endpoint /mcp/{MCP_TOKEN} (unlisted, internal testing).
      MCP_TOKEN: ${MCP_TOKEN:-}
    ports:
      # Bound to localhost: a reverse proxy (nginx) in front publishes it.
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # The website (Astro SSR). Reads the API over the Compose network.
  web:
    <<: *hardened
    profiles: [app]
    build:
      context: .
      dockerfile: apps/web-front/Dockerfile
    image: pgtm-web
    environment:
      API_URL: http://api:3000
      # The public address, for canonical links (the container sees itself as localhost).
      SITE_URL: ${SITE_URL:-}
      # Search engines stay out until every cinema has been notified (AGENTS.md).
      INDEXING: ${INDEXING:-off}
    ports:
      - "127.0.0.1:${WEB_PORT:-4321}:4321"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # One-shot, on demand: `docker compose run --rm ingest` loads ./data/normalized (the
  # files `pnpm data:push` sends from the machine that pulls) into Postgres.
  ingest:
    <<: *hardened
    profiles: [ingest]
    build: .
    image: pgtm-api
    command: ["node", "dist/ingest.mjs", "--dir", "/data/normalized"]
    environment:
      DATABASE_URL: postgres://pgtm:${POSTGRES_PASSWORD:-pgtm}@postgres:5432/pgtm
    volumes:
      - ./data/normalized:/data/normalized:ro
    # Run it with the stack up: `migrate` has already brought the schema up to date.
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres:
