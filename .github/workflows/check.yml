# `pnpm check` on every pull request and on main: typecheck, lint (zero warnings), format,
# the website build and every test. Make it a required status check on main, so a PR
# that breaks it (a bad conflict resolution included) cannot be merged.
name: check

on:
  pull_request:
  push:
    branches: [main]

# Read-only: the job needs the code and nothing else.
permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      # The backend's integration tests. Same image as compose.yaml: keep the two in step.
      postgres:
        image: postgres:18.6-alpine3.24@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
        env:
          POSTGRES_USER: pgtm
          POSTGRES_PASSWORD: pgtm
          POSTGRES_DB: pgtm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pgtm -d pgtm_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://pgtm:pgtm@localhost:5432/pgtm_test
    steps:
      # Actions are pinned by commit; Dependabot proposes updates (.github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm version comes from package.json's packageManager; pnpm then downloads the
      # Node that devEngines pins, as on every machine.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
