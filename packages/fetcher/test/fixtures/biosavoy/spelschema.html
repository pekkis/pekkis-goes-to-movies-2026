<!doctype html>
<html lang="sv">
  <body>
    <main id="main">
      <section class="schedule" data-section="schedule">
        <div class="container-narrow">
          <div class="flex flex-wrap items-end justify-between gap-x-8 gap-y-3">
            <h1 class="heading-lg">Spelschema</h1>
            <p class="note">
              Bioprogrammet framställs veckovis, fredag till torsdag, och uppdateras på tisdagar.
            </p>
          </div>

          <div class="schedule__days flex flex-col">
            <div>
              <h2 class="schedule__day-heading flex items-baseline gap-3.5">
                Onsdag <span>28/10</span>
              </h2>
              <ul class="show-list">
                <li>
                  <a
                    class="show-row show-row--link grid items-center gap-4"
                    href="/film/pikkuli-och-himmelshinden"
                  >
                    <span class="show-row__time show-row__time--large">18.15</span>
                    <span class="show-row__title">PIKKULI OCH HIMMELSHINDEN</span>
                    <span class="flex items-center gap-4"
                      ><span class="chip">Sal 2</span
                      ><span class="show-row__arrow" aria-hidden="true">→</span></span
                    >
                  </a>
                </li>

                <li>
                  <a
                    class="show-row show-row--link grid items-center gap-4"
                    href="/film/lapin-sota-lapplandskriget"
                  >
                    <span class="show-row__time show-row__time--large">19.30</span>
                    <span class="show-row__title">LAPIN SOTA (Lapplandskriget)</span>
                    <span class="flex items-center gap-4"
                      ><span class="chip">Sal 1</span
                      ><span class="show-row__arrow" aria-hidden="true">→</span></span
                    >
                  </a>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
